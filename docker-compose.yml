services:
  db_flare:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: morpho_flare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgresflarepassword
    ports: ["5432:5432"]
    volumes:
      - db_flare_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  processor_flare:
    build: .
    restart: unless-stopped
    env_file: .env.flare
    environment:
      DB_HOST: db_flare
    depends_on:
      db_flare:
        condition: service_healthy
    volumes:
      - ./oracle-feeds.json:/squid/oracle-feeds.json
    command: sh -c "npx squid-typeorm-migration apply && node lib/main.js"

  graphql_flare:
    build: .
    restart: unless-stopped
    env_file: .env.flare
    environment:
      DB_HOST: db_flare
    depends_on:
      db_flare:
        condition: service_healthy
    command: sh -c "GUARD_PUBLIC_PORT=4000 GUARD_INTERNAL_PORT=14000 node lib/auth/guardedGraphql.js"
    ports: ["4350:4000"]

  db_plume:
