# ------- Public Allocator -------
# Per-(vault, market) flow caps published by the PublicAllocator contract.
# `maxOut` is the amount the public allocator may still pull OUT of this
# market on this vault's behalf; the gateway sums min(maxOut, vaultAssets)
# across vaults to derive a market's publicAllocatorSharedLiquidity.
#
# Caps are seeded from SetFlowCaps and then adjusted in-place by every
# PublicWithdrawal / PublicReallocateTo, mirroring the contract's own
# bookkeeping, so the stored value tracks live remaining capacity.
type PublicAllocatorFlowCap @entity {
  id: ID! # {vaultAddress}-{marketId}
  vault: MetaMorpho!
  market: Market!
  maxIn: BigInt!
  maxOut: BigInt!
  lastUpdate: BigInt!
}

