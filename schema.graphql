# ========================================================================
# Canton (Mystic) — non-EVM indexer entities
#
# Canton's MysticMarket lives on a Daml ledger, not an EVM chain. Markets,
# Positions, and LendingPositions are churning contracts (archived + recreated
# on every state-changing exercise), so identity is the churn-stable `marketId`
# (keccak256 identity set at CreateMarket), not the live contract id.
#
# CantonMarket.id   = marketId   (churn-stable; equivalent of EVM marketId)
# CantonMarket.marketCid = the live Market cid right now (denormalized)
# CantonOracle is keyed by {provider}|{baseAsset}|{quoteAsset}; one oracle
# serves many markets on the same pair.
# CantonMarketLineage maps every Market cid ever seen to its CantonMarket so
# stale FE URLs / bookmarks still resolve.
#
# Mode A scope ships only the market + snapshot entities (chart history).
# Position / fragment entities are out of scope for v1 but the schema is
# laid out so adding them later doesn't break the existing tables.
# ========================================================================

# Append-only map of every Canton Market contract id ever observed → its
# oracle. The cron snapshot architecture used to lose transient cids that
# lived less than the polling interval; this index, populated from the
# update-stream, never misses a cid.
type CantonMarketLineage @entity {
  id: ID!                              # marketCid (Canton contract id of the Market template)
  market: CantonMarket!
  firstSeen: BigInt!                   # ledger record time of the create event
  lastSeen: BigInt!                    # ledger record time of the most recent observation
  archivedAt: BigInt                   # null while live, else record time of archive event
}

# Canton equivalent of EVM `Market`. Stable id = oracle contract id.
type CantonOracle @entity {
  id: ID!                              # {provider}|{baseAsset}|{quoteAsset} — cid churns, this doesn't
  price: BigInt                        # collateral in loan units, 1e10-scaled
  priceUpdatedAt: BigInt
}

type CantonMarket @entity {
  id: ID!                              # marketId
  marketId: String!                    # keccak256 market identity (set at CreateMarket)
  oracleKey: String @index             # {oracleProvider}|{collateralToken}|{loanToken}; one oracle, many markets
  paramsOracle: String @index          # frozen cid; joins position -> market
  marketCid: String!                   # latest live Market cid (denormalized for query speed)
  loanToken: Token!
  collateralToken: Token!
  irm: String!                         # current IRM contract id (also churns; informational)
  lltv: BigInt!                        # single threshold (borrow cap AND liquidation line), 1e10-scaled
  fee: BigInt!
  # On-ledger totals, refreshed on every Market create event (= every state change)
  totalSupplyAssets: BigInt!
  totalSupplyShares: BigInt!
  totalBorrowAssets: BigInt!
  totalBorrowShares: BigInt!
  # Oracle price (collateral in loan units, 1e10-scaled), from the oracle template payload.
  oraclePrice: BigInt
  priceUpdatedAt: BigInt
  # APY (annualised, derived from irm.currentRate + utilisation + fee)
  borrowAPY: BigDecimal!
  supplyAPY: BigDecimal!
  lastUpdate: BigInt!                  # ledger record time of the most recent create observed
  # Relations
  lineage: [CantonMarketLineage!]! @derivedFrom(field: "market")
  positions: [CantonPosition!]! @derivedFrom(field: "market")
  dailySnapshots: [CantonMarketDailySnapshot!]! @derivedFrom(field: "market")
  hourlySnapshots: [CantonMarketHourlySnapshot!]! @derivedFrom(field: "market")
}

# Canton borrower position. Stable id = {oracle}-{owner} (survives Position cid churn).
type CantonPosition @entity {
  id: ID!                              # {oracle}-{owner}
  currentContractId: String!           # latest live Position cid
  market: CantonMarket!                # join by oracle
  marketId: String!                    # cross-provider market key
  owner: String!                       # borrower party
  provider: String!
  collateralAmount: BigInt!            # 1e10-scaled
  borrowShares: BigInt!                # 1e10-scaled
  lltv: BigInt!                        # 1e10-scaled (pinned on the position)
  borrowAssets: BigInt!                # borrowShares * totalBorrowAssets / totalBorrowShares
  liquidatable: Boolean!               # borrowAssets > collateralAmount * oraclePrice * lltv
  lastUpdate: BigInt!
  lineage: [CantonPositionLineage!]! @derivedFrom(field: "position")
}

# Append-only map of every Canton Position contract id → its {oracle}-{owner}.
type CantonPositionLineage @entity {
  id: ID!                              # Position contract id
  position: CantonPosition!
  firstSeen: BigInt!
  lastSeen: BigInt!
  archivedAt: BigInt
}

type CantonMarketDailySnapshot @entity {
  id: ID!                              # {marketOracle}-{dayId}
  market: CantonMarket!
  dayId: Int!
  timestamp: BigInt!
  totalSupplyAssets: BigInt!
  totalSupplyShares: BigInt!
  totalBorrowAssets: BigInt!
  totalBorrowShares: BigInt!
  borrowAPY: BigDecimal!
  supplyAPY: BigDecimal!
}

type CantonMarketHourlySnapshot @entity {
  id: ID!                              # {marketOracle}-{hourId}
  market: CantonMarket!
  hourId: Int!
  timestamp: BigInt!
  totalSupplyAssets: BigInt!
  totalSupplyShares: BigInt!
  totalBorrowAssets: BigInt!
  totalBorrowShares: BigInt!
  borrowAPY: BigDecimal!
  supplyAPY: BigDecimal!
}

# Persisted update-stream offset for resume after restart. Singleton row,
# id='canton-indexer'. Written within the same transaction as each batch's
# entity writes so a crash mid-batch replays cleanly.
type CantonIndexerState @entity {
  id: ID!
  lastOffset: String!
  lastEventTime: BigInt!
  eventsProcessed: BigInt!
  updatedAt: BigInt!
}
